<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<style>
  body { width:420px; margin:0; font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#f5f6f8; }
  header { display:flex; align-items:center; gap:8px; padding:10px 12px; background:#fff; border-bottom:1px solid #e4e6eb; }
  .logo { font-weight:700; font-size:15px; } .logo em { color:#1e6ef5; font-style:normal; }
  select { margin-left:auto; font-size:12px; padding:4px 6px; border:1px solid #e4e6eb; border-radius:6px; background:#fff; max-width:160px; }
  textarea { width:100%; height:170px; box-sizing:border-box; border:none; outline:none; resize:vertical; padding:12px; font-family:Consolas,Menlo,monospace; font-size:12.5px; line-height:1.7; background:#fcfcfd; }
  .bar { display:flex; gap:8px; padding:10px 12px; background:#fff; border-top:1px solid #e4e6eb; }
  button { flex:1; padding:8px; border:none; border-radius:8px; font-size:13px; cursor:pointer; }
  .primary { background:#1e6ef5; color:#fff; font-weight:600; }
  .ghost { background:#fff; border:1px solid #e4e6eb; }
  #tip { font-size:11.5px; color:#8a8f99; padding:0 12px 10px; background:#fff; }

  /* 主题包解锁面板 */
  #unlock { display:none; background:#fff; border-top:1px solid #e4e6eb; padding:14px 12px; }
  #unlock.show { display:block; }
  #unlock h4 { margin:0 0 6px; font-size:13.5px; }
  #unlock .sub { font-size:11.5px; color:#8a8f99; line-height:1.7; margin-bottom:10px; }
  #qr-box { border:1px dashed #e4e6eb; border-radius:10px; padding:10px; display:flex; align-items:center; justify-content:center; min-height:86px; margin-bottom:10px; }
  #qr-box img { width:120px; height:120px; border-radius:6px; }
  #qr-ph { font-size:11.5px; color:#8a8f99; text-align:center; line-height:1.9; }
  #code { width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid #e4e6eb; border-radius:8px; font-size:12.5px; text-align:center; font-family:Consolas,Menlo,monospace; letter-spacing:.04em; }
  #code:focus { outline:none; border-color:#1e6ef5; }
  #msg { font-size:11.5px; min-height:15px; margin:7px 0 0; text-align:center; }
  #msg.err { color:#d64545; } #msg.ok { color:#2e9e5b; }
  .row { display:flex; gap:8px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <div class="logo">墨<em>排</em></div>
  <select id="theme"></select>
</header>
<textarea id="editor" placeholder="把 Markdown 粘贴到这里…"></textarea>

<div id="unlock">
  <h4>🔒 <span id="unlock-name"></span> 属于主题包</h4>
  <div class="sub">输入解锁码即可永久解锁全部 6 套主题，一次付费、后续新主题免费更新。纯本地校验，不联网、不上传你的文章。</div>
  <div id="qr-box">
    <img id="qr" alt="微信收款码" style="display:none"/>
    <div id="qr-ph">微信收款码即将上线<br/>当前可通过作者处购买解锁码</div>
  </div>
  <input id="code" placeholder="输入解锁码 MQ-XXXX-XXXX-XXXX-XXXX" maxlength="23"/>
  <div class="row">
    <button class="primary" id="btn-unlock">解锁主题包</button>
    <button class="ghost" id="btn-cancel">取消</button>
  </div>
  <p id="msg"></p>
</div>

<div class="bar">
  <button class="primary" id="copy">📋 复制排版结果</button>
  <button class="ghost" id="fill">📝 填入公众号编辑器</button>
</div>
<div id="tip">复制后到公众号编辑器直接粘贴即可；「填入」仅在你已打开公众号后台页面时可用。</div>
<script src="sha256.js"></script>
<script src="keys.js"></script>
<script src="renderer.js"></script>
<script src="popup.js"></script>
</body>
</html>
