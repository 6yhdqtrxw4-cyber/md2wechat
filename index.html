<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>墨排 · Markdown 转公众号排版</title>
<link rel="canonical" href="https://6yhdqtrxw4-cyber.github.io/md2wechat/"/>
<style>
  :root { --accent:#1e6ef5; --bg:#f5f6f8; --panel:#ffffff; --text:#2b2b2b; --muted:#8a8f99; --border:#e4e6eb; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  header { display:flex; align-items:center; gap:12px; padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--border); }
  .logo { font-size:18px; font-weight:700; }
  .logo em { color:var(--accent); font-style:normal; }
  .tagline { font-size:12px; color:var(--muted); }
  .spacer { flex:1; }

  .themes { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .chip { padding:5px 12px; border-radius:999px; border:1px solid var(--border); background:#fff; font-size:12.5px; cursor:pointer; color:var(--text); }
  .chip.active { border-color:var(--accent); color:var(--accent); background:#eef4ff; font-weight:600; }
  .chip.locked { color:var(--muted); background:#fafafa; }
  .chip.locked::after { content:" 🔒"; }

  .btn { padding:7px 16px; border-radius:8px; border:none; font-size:13.5px; cursor:pointer; }
  .btn-primary { background:var(--accent); color:#fff; font-weight:600; }
  .btn-primary:hover { filter:brightness(1.08); }
  .btn-ghost { background:#fff; border:1px solid var(--border); color:var(--text); }

  main { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:12px; min-height:0; }
  .pane { background:var(--panel); border:1px solid var(--border); border-radius:10px; display:flex; flex-direction:column; overflow:hidden; }
  .pane-title { padding:8px 14px; font-size:12px; color:var(--muted); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; }
  textarea { flex:1; border:none; outline:none; resize:none; padding:16px; font-family:Consolas,Menlo,"Courier New",monospace; font-size:13.5px; line-height:1.7; color:var(--text); background:#fcfcfd; }
  .preview { flex:1; overflow-y:auto; padding:0; background:#fff; }
  .preview-inner { max-width:677px; margin:0 auto; padding:24px 16px; }

  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:#2b2b2b; color:#fff; padding:10px 20px; border-radius:8px; font-size:13.5px; opacity:0; transition:all .25s; pointer-events:none; }
  #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

  #modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:10; }
  #modal-mask.show { display:flex; }
  #modal { background:#fff; border-radius:14px; width:360px; padding:28px; text-align:center; max-height:90vh; overflow-y:auto; }
  #modal h3 { margin-bottom:8px; }
  #modal p { font-size:13px; color:var(--muted); line-height:1.7; margin-bottom:16px; }
  #modal .price { font-size:24px; color:var(--accent); font-weight:700; margin-bottom:6px; }
  #modal .price-sub { font-size:12px; color:var(--muted); margin-bottom:14px; }
  #qr-box { border:1px dashed var(--border); border-radius:10px; padding:12px; margin-bottom:14px; display:flex; align-items:center; justify-content:center; min-height:150px; }
  #qr-box img { width:150px; height:150px; border-radius:6px; }
  #qr-placeholder { font-size:12px; color:var(--muted); line-height:1.8; }
  .pay-note { font-size:12px !important; color:var(--muted) !important; text-align:left; background:#f7f9fc; border-radius:8px; padding:10px 12px; margin-bottom:14px !important; }
  #unlock-input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; margin-bottom:10px; text-align:center; font-family:Consolas,Menlo,monospace; letter-spacing:.05em; }
  #unlock-input:focus { outline:none; border-color:var(--accent); }
  #unlock-err { color:#d64545; font-size:12px; min-height:16px; margin:8px 0 0 !important; }
  #unlock-ok { color:#2e9e5b; font-size:12px; min-height:16px; margin:8px 0 0 !important; }
</style>
</head>
<body>
<header>
  <div class="logo">墨<em>排</em></div>
  <div class="tagline">Markdown → 公众号排版引擎 · MVP v0.1</div>
  <div class="spacer"></div>
  <div class="themes" id="theme-bar"></div>
  <button class="btn btn-ghost" id="btn-html">导出 HTML</button>
  <button class="btn btn-primary" id="btn-copy">📋 复制到公众号</button>
</header>
<main>
  <div class="pane">
    <div class="pane-title"><span>Markdown 源码</span><span id="stat"></span></div>
    <textarea id="editor" spellcheck="false"></textarea>
  </div>
  <div class="pane">
    <div class="pane-title"><span>微信渲染预览（677px 与公众号一致）</span></div>
    <div class="preview"><div class="preview-inner" id="preview"></div></div>
  </div>
</main>

<div id="toast"></div>
<div id="modal-mask">
  <div id="modal">
    <h3>🔒 付费主题</h3>
    <p>商务深蓝、国风朱砂、暗夜极客等 12 套进阶主题属于<strong>墨排主题包</strong>。解锁后全部 15 套主题永久可用，后续新主题免费更新。</p>
    <div class="price">¥19.9 <s style="font-size:13px;color:#999;font-weight:400">¥49</s></div>
    <div class="price-sub">一次付费 · 永久使用 · 无需注册</div>
    <div id="pay-view">
      <div id="qr-box">
        <img id="pay-qr" src="pay-qrcode.png" alt="微信收款码" onerror="this.style.display='none';document.getElementById('qr-placeholder').style.display='block'"/>
        <div id="qr-placeholder" style="display:none">微信收款码<br/>即将上线，敬请期待</div>
      </div>
      <p class="pay-note">微信扫码支付 ¥19.9 → 付款后会收到<strong>解锁码</strong> → 在下方输入解锁码，立即解锁全部 15 套主题。当前版本解锁码由客服人工发放，请保留付款记录。</p>
    </div>
    <input id="unlock-input" placeholder="输入解锁码 MQ-XXXX-XXXX-XXXX-XXXX" maxlength="23"/>
    <button class="btn btn-primary" id="btn-unlock" style="width:100%">解锁主题包</button>
    <p id="unlock-err"></p>
    <p id="unlock-ok"></p>
  </div>
</div>

<script src="sha256.js"></script>
<script src="renderer.js"></script>
<script src="app.js"></script>
</body>
</html>
